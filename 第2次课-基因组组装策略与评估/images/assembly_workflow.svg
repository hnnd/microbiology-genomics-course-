<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #1f2937; }
      .label { font-family: Arial, sans-serif; font-size: 12px; fill: #374151; }
      .short-read { fill: #dbeafe; stroke: #3b82f6; stroke-width: 2; }
      .long-read { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .process { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; }
      .result { fill: #f3e8ff; stroke: #8b5cf6; stroke-width: 2; }
      .arrow { fill: #374151; }
    </style>
  </defs>
  
  <!-- 标题 -->
  <text x="400" y="30" text-anchor="middle" class="title">混合组装工作流程</text>
  
  <!-- 输入数据 -->
  <rect x="100" y="70" width="120" height="40" class="short-read" rx="5"/>
  <text x="160" y="95" text-anchor="middle" class="label">短读长数据</text>
  <text x="160" y="110" text-anchor="middle" class="label">(Illumina)</text>
  
  <rect x="580" y="70" width="120" height="40" class="long-read" rx="5"/>
  <text x="640" y="95" text-anchor="middle" class="label">长读长数据</text>
  <text x="640" y="110" text-anchor="middle" class="label">(PacBio/Nanopore)</text>
  
  <!-- 初步组装 -->
  <rect x="100" y="170" width="120" height="40" class="process" rx="5"/>
  <text x="160" y="195" text-anchor="middle" class="label">SPAdes组装</text>
  
  <rect x="580" y="170" width="120" height="40" class="process" rx="5"/>
  <text x="640" y="195" text-anchor="middle" class="label">miniasm组装</text>
  
  <!-- 箭头 -->
  <polygon points="160,110 160,160 155,150 165,150" class="arrow"/>
  <polygon points="640,110 640,160 635,150 645,150" class="arrow"/>
  
  <!-- 整合分析 -->
  <rect x="340" y="270" width="120" height="40" class="process" rx="5"/>
  <text x="400" y="295" text-anchor="middle" class="label">Unicycler整合</text>
  
  <!-- 箭头汇聚 -->
  <polygon points="160,210 400,260 400,270 390,270 400,260 410,270" class="arrow"/>
  <polygon points="640,210 400,260 400,270 390,270 400,260 410,270" class="arrow"/>
  
  <!-- 后续处理 -->
  <rect x="340" y="370" width="120" height="40" class="process" rx="5"/>
  <text x="400" y="395" text-anchor="middle" class="label">桥接分析</text>
  
  <polygon points="400,310 400,360 395,350 405,350" class="arrow"/>
  
  <rect x="340" y="470" width="120" height="40" class="process" rx="5"/>
  <text x="400" y="495" text-anchor="middle" class="label">序列校正</text>
  
  <polygon points="400,410 400,460 395,450 405,450" class="arrow"/>
  
  <!-- 最终结果 -->
  <rect x="340" y="550" width="120" height="40" class="result" rx="5"/>
  <text x="400" y="575" text-anchor="middle" class="label">最终组装</text>
  
  <polygon points="400,510 400,540 395,530 405,530" class="arrow"/>
  
  <!-- 优势说明 -->
  <text x="50" y="350" class="label">短读长优势：</text>
  <text x="50" y="370" class="label">• 高准确性</text>
  <text x="50" y="385" class="label">• 低成本</text>
  <text x="50" y="400" class="label">• 序列校正</text>
  
  <text x="550" y="350" class="label">长读长优势：</text>
  <text x="550" y="370" class="label">• 跨越重复序列</text>
  <text x="550" y="385" class="label">• 结构框架</text>
  <text x="550" y="400" class="label">• 连续性好</text>
</svg>