<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #1f2937; }
      .label { font-family: Arial, sans-serif; font-size: 14px; fill: #374151; }
      .box { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 2; }
      .process { fill: #dbeafe; stroke: #3b82f6; stroke-width: 2; }
      .result { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; }
      .contamination { fill: #fee2e2; stroke: #ef4444; stroke-width: 2; }
      .arrow { fill: #374151; }
    </style>
  </defs>
  
  <!-- 标题 -->
  <text x="400" y="30" text-anchor="middle" class="title">污染序列检测流程</text>
  
  <!-- 原始序列 -->
  <rect x="350" y="60" width="100" height="40" class="box" rx="5"/>
  <text x="400" y="85" text-anchor="middle" class="label">原始序列</text>
  
  <!-- 分析方法 -->
  <!-- GC含量分析 -->
  <rect x="100" y="150" width="120" height="40" class="process" rx="5"/>
  <text x="160" y="175" text-anchor="middle" class="label">GC含量分析</text>
  
  <!-- 分类学注释 -->
  <rect x="340" y="150" width="120" height="40" class="process" rx="5"/>
  <text x="400" y="175" text-anchor="middle" class="label">分类学注释</text>
  
  <!-- 覆盖度分析 -->
  <rect x="580" y="150" width="120" height="40" class="process" rx="5"/>
  <text x="640" y="175" text-anchor="middle" class="label">覆盖度分析</text>
  
  <!-- 箭头从原始序列到各分析方法 -->
  <polygon points="370,100 160,140 160,150 150,150 160,140 170,150" class="arrow"/>
  <polygon points="400,100 400,140 395,130 405,130" class="arrow"/>
  <polygon points="430,100 640,140 640,150 630,150 640,140 650,150" class="arrow"/>
  
  <!-- 检测结果 -->
  <!-- 异常GC区域 -->
  <rect x="100" y="240" width="120" height="40" class="result" rx="5"/>
  <text x="160" y="265" text-anchor="middle" class="label">异常GC区域</text>
  
  <!-- 非目标物种 -->
  <rect x="340" y="240" width="120" height="40" class="result" rx="5"/>
  <text x="400" y="265" text-anchor="middle" class="label">非目标物种</text>
  
  <!-- 异常覆盖度 -->
  <rect x="580" y="240" width="120" height="40" class="result" rx="5"/>
  <text x="640" y="265" text-anchor="middle" class="label">异常覆盖度</text>
  
  <!-- 箭头从分析方法到结果 -->
  <polygon points="160,190 160,230 155,220 165,220" class="arrow"/>
  <polygon points="400,190 400,230 395,220 405,220" class="arrow"/>
  <polygon points="640,190 640,230 635,220 645,220" class="arrow"/>
  
  <!-- 最终结果 -->
  <rect x="340" y="330" width="120" height="40" class="contamination" rx="5"/>
  <text x="400" y="355" text-anchor="middle" class="label">污染序列</text>
  
  <!-- 箭头汇聚到最终结果 -->
  <polygon points="160,280 400,320 400,330 390,330 400,320 410,330" class="arrow"/>
  <polygon points="400,280 400,320 395,310 405,310" class="arrow"/>
  <polygon points="640,280 400,320 400,330 390,330 400,320 410,330" class="arrow"/>
  
  <!-- 检测工具说明 -->
  <text x="50" y="420" class="label">常用检测工具：</text>
  <text x="50" y="440" class="label">• Kraken2: 快速分类学注释</text>
  <text x="50" y="460" class="label">• ContEst16S: 16S rRNA污染检测</text>
  <text x="50" y="480" class="label">• CheckM: 系统性污染评估</text>
  
  <text x="400" y="420" class="label">污染来源：</text>
  <text x="400" y="440" class="label">• 宿主DNA污染</text>
  <text x="400" y="460" class="label">• 环境DNA污染</text>
  <text x="400" y="480" class="label">• 试剂和交叉污染</text>
</svg>