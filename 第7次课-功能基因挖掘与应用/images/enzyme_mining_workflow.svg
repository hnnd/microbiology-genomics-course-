<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #2c3e50; }
      .step-text { font-family: Arial, sans-serif; font-size: 14px; fill: #34495e; }
      .small-text { font-family: Arial, sans-serif; font-size: 12px; fill: #7f8c8d; }
      .box { fill: #ecf0f1; stroke: #34495e; stroke-width: 2; rx: 8; }
      .process-box { fill: #3498db; stroke: #2980b9; stroke-width: 2; rx: 8; }
      .result-box { fill: #2ecc71; stroke: #27ae60; stroke-width: 2; rx: 8; }
      .arrow { stroke: #34495e; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title-text">酶基因挖掘工作流程</text>
  
  <!-- Step 1: Genome Scanning -->
  <rect x="50" y="80" width="150" height="80" class="box"/>
  <text x="125" y="110" text-anchor="middle" class="step-text">基因组扫描</text>
  <text x="125" y="130" text-anchor="middle" class="small-text">识别潜在酶基因</text>
  <text x="125" y="145" text-anchor="middle" class="small-text">ORF预测</text>
  
  <!-- Arrow 1 -->
  <line x1="200" y1="120" x2="250" y2="120" class="arrow"/>
  
  <!-- Step 2: Functional Prediction -->
  <rect x="270" y="80" width="150" height="80" class="process-box"/>
  <text x="345" y="110" text-anchor="middle" class="step-text" fill="white">功能预测</text>
  <text x="345" y="130" text-anchor="middle" class="small-text" fill="white">BLAST搜索</text>
  <text x="345" y="145" text-anchor="middle" class="small-text" fill="white">结构域分析</text>
  
  <!-- Arrow 2 -->
  <line x1="420" y1="120" x2="470" y2="120" class="arrow"/>
  
  <!-- Step 3: Priority Ranking -->
  <rect x="490" y="80" width="150" height="80" class="box"/>
  <text x="565" y="110" text-anchor="middle" class="step-text">优先级排序</text>
  <text x="565" y="130" text-anchor="middle" class="small-text">新颖性评估</text>
  <text x="565" y="145" text-anchor="middle" class="small-text">应用潜力</text>
  
  <!-- Arrow down -->
  <line x1="565" y1="160" x2="565" y2="210" class="arrow"/>
  
  <!-- Step 4: Gene Cloning -->
  <rect x="490" y="230" width="150" height="80" class="process-box"/>
  <text x="565" y="260" text-anchor="middle" class="step-text" fill="white">基因克隆</text>
  <text x="565" y="280" text-anchor="middle" class="small-text" fill="white">PCR扩增</text>
  <text x="565" y="295" text-anchor="middle" class="small-text" fill="white">载体构建</text>
  
  <!-- Arrow left -->
  <line x1="490" y1="270" x2="420" y2="270" class="arrow"/>
  
  <!-- Step 5: Heterologous Expression -->
  <rect x="270" y="230" width="150" height="80" class="box"/>
  <text x="345" y="260" text-anchor="middle" class="step-text">异源表达</text>
  <text x="345" y="280" text-anchor="middle" class="small-text">宿主转化</text>
  <text x="345" y="295" text-anchor="middle" class="small-text">蛋白诱导</text>
  
  <!-- Arrow left -->
  <line x1="270" y1="270" x2="200" y2="270" class="arrow"/>
  
  <!-- Step 6: Activity Detection -->
  <rect x="50" y="230" width="150" height="80" class="result-box"/>
  <text x="125" y="260" text-anchor="middle" class="step-text" fill="white">活性检测</text>
  <text x="125" y="280" text-anchor="middle" class="small-text" fill="white">酶活测定</text>
  <text x="125" y="295" text-anchor="middle" class="small-text" fill="white">产物分析</text>
  
  <!-- Arrow down -->
  <line x1="125" y1="310" x2="125" y2="360" class="arrow"/>
  
  <!-- Step 7: Characterization -->
  <rect x="50" y="380" width="150" height="80" class="result-box"/>
  <text x="125" y="410" text-anchor="middle" class="step-text" fill="white">酶学性质</text>
  <text x="125" y="430" text-anchor="middle" class="small-text" fill="white">最适条件</text>
  <text x="125" y="445" text-anchor="middle" class="small-text" fill="white">动力学参数</text>
  
  <!-- Arrow right -->
  <line x1="200" y1="420" x2="270" y2="420" class="arrow"/>
  
  <!-- Step 8: Structure Analysis -->
  <rect x="290" y="380" width="150" height="80" class="box"/>
  <text x="365" y="410" text-anchor="middle" class="step-text">结构分析</text>
  <text x="365" y="430" text-anchor="middle" class="small-text">3D建模</text>
  <text x="365" y="445" text-anchor="middle" class="small-text">活性位点</text>
  
  <!-- Arrow right -->
  <line x1="440" y1="420" x2="490" y2="420" class="arrow"/>
  
  <!-- Step 9: Engineering -->
  <rect x="510" y="380" width="150" height="80" class="process-box"/>
  <text x="585" y="410" text-anchor="middle" class="step-text" fill="white">工程改造</text>
  <text x="585" y="430" text-anchor="middle" class="small-text" fill="white">定向进化</text>
  <text x="585" y="445" text-anchor="middle" class="small-text" fill="white">理性设计</text>
  
  <!-- Database boxes -->
  <rect x="680" y="120" width="100" height="40" class="box"/>
  <text x="730" y="145" text-anchor="middle" class="small-text">数据库</text>
  
  <rect x="680" y="170" width="100" height="30" class="box"/>
  <text x="730" y="190" text-anchor="middle" class="small-text">NCBI</text>
  
  <rect x="680" y="210" width="100" height="30" class="box"/>
  <text x="730" y="230" text-anchor="middle" class="small-text">UniProt</text>
  
  <rect x="680" y="250" width="100" height="30" class="box"/>
  <text x="730" y="270" text-anchor="middle" class="small-text">Pfam</text>
  
  <!-- Database arrows -->
  <line x1="640" y1="120" x2="680" y2="140" class="arrow"/>
  
  <!-- Legend -->
  <rect x="50" y="520" width="20" height="15" class="box"/>
  <text x="80" y="532" class="small-text">数据分析</text>
  
  <rect x="180" y="520" width="20" height="15" class="process-box"/>
  <text x="210" y="532" class="small-text">实验操作</text>
  
  <rect x="310" y="520" width="20" height="15" class="result-box"/>
  <text x="340" y="532" class="small-text">结果产出</text>
</svg>