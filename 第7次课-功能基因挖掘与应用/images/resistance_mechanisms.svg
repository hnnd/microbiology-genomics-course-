<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #2c3e50; }
      .mechanism-text { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #34495e; }
      .gene-text { font-family: Arial, sans-serif; font-size: 12px; fill: white; font-weight: bold; }
      .label-text { font-family: Arial, sans-serif; font-size: 12px; fill: #34495e; }
      .small-text { font-family: Arial, sans-serif; font-size: 10px; fill: #7f8c8d; }
      .enzyme-box { fill: #e74c3c; stroke: #c0392b; stroke-width: 2; rx: 8; }
      .target-box { fill: #3498db; stroke: #2980b9; stroke-width: 2; rx: 8; }
      .efflux-box { fill: #2ecc71; stroke: #27ae60; stroke-width: 2; rx: 8; }
      .pathway-box { fill: #f39c12; stroke: #e67e22; stroke-width: 2; rx: 8; }
      .arrow { stroke: #34495e; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .inhibit-arrow { stroke: #e74c3c; stroke-width: 2; fill: none; marker-end: url(#inhibit); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
    <marker id="inhibit" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <circle cx="5" cy="5" r="4" fill="none" stroke="#e74c3c" stroke-width="2"/>
      <line x1="2" y1="2" x2="8" y2="8" stroke="#e74c3c" stroke-width="2"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title-text">多重抗生素抗性机制网络</text>
  
  <!-- Central antibiotic -->
  <circle cx="400" cy="300" r="40" fill="#95a5a6" stroke="#7f8c8d" stroke-width="3"/>
  <text x="400" y="295" text-anchor="middle" class="mechanism-text">抗生素</text>
  <text x="400" y="310" text-anchor="middle" class="small-text">Antibiotic</text>
  
  <!-- Mechanism 1: Enzymatic Modification -->
  <rect x="100" y="120" width="120" height="60" class="enzyme-box"/>
  <text x="160" y="145" text-anchor="middle" class="gene-text">酶修饰机制</text>
  <text x="160" y="165" text-anchor="middle" class="gene-text">β-内酰胺酶</text>
  
  <rect x="80" y="200" width="80" height="40" class="enzyme-box"/>
  <text x="120" y="225" text-anchor="middle" class="gene-text">乙酰转移酶</text>
  
  <rect x="180" y="200" width="80" height="40" class="enzyme-box"/>
  <text x="220" y="225" text-anchor="middle" class="gene-text">磷酸化酶</text>
  
  <!-- Arrows from enzymatic modification to antibiotic -->
  <line x1="220" y1="180" x2="360" y2="280" class="inhibit-arrow"/>
  <line x1="160" y1="240" x2="360" y2="290" class="inhibit-arrow"/>
  <line x1="220" y1="240" x2="360" y2="290" class="inhibit-arrow"/>
  
  <!-- Mechanism 2: Target Modification -->
  <rect x="580" y="120" width="120" height="60" class="target-box"/>
  <text x="640" y="145" text-anchor="middle" class="gene-text">靶点改变</text>
  <text x="640" y="165" text-anchor="middle" class="gene-text">rRNA甲基化</text>
  
  <rect x="560" y="200" width="80" height="40" class="target-box"/>
  <text x="600" y="225" text-anchor="middle" class="gene-text">PBP突变</text>
  
  <rect x="660" y="200" width="80" height="40" class="target-box"/>
  <text x="700" y="225" text-anchor="middle" class="gene-text">回旋酶突变</text>
  
  <!-- Arrows from target modification -->
  <line x1="580" y1="180" x2="440" y2="280" class="inhibit-arrow"/>
  <line x1="600" y1="240" x2="440" y2="290" class="inhibit-arrow"/>
  <line x1="700" y1="240" x2="440" y2="290" class="inhibit-arrow"/>
  
  <!-- Mechanism 3: Efflux Pumps -->
  <rect x="340" y="80" width="120" height="60" class="efflux-box"/>
  <text x="400" y="105" text-anchor="middle" class="gene-text">外排泵系统</text>
  <text x="400" y="125" text-anchor="middle" class="gene-text">多药外排</text>
  
  <rect x="300" y="160" width="80" height="40" class="efflux-box"/>
  <text x="340" y="185" text-anchor="middle" class="gene-text">AcrAB-TolC</text>
  
  <rect x="420" y="160" width="80" height="40" class="efflux-box"/>
  <text x="460" y="185" text-anchor="middle" class="gene-text">MexAB-OprM</text>
  
  <!-- Arrows from efflux pumps -->
  <line x1="400" y1="140" x2="400" y2="260" class="inhibit-arrow"/>
  <line x1="340" y1="200" x2="380" y2="270" class="inhibit-arrow"/>
  <line x1="460" y1="200" x2="420" y2="270" class="inhibit-arrow"/>
  
  <!-- Mechanism 4: Metabolic Bypass -->
  <rect x="100" y="420" width="120" height="60" class="pathway-box"/>
  <text x="160" y="445" text-anchor="middle" class="gene-text">代谢旁路</text>
  <text x="160" y="465" text-anchor="middle" class="gene-text">替代途径</text>
  
  <rect x="80" y="500" width="80" height="40" class="pathway-box"/>
  <text x="120" y="525" text-anchor="middle" class="gene-text">folA突变</text>
  
  <rect x="180" y="500" width="80" height="40" class="pathway-box"/>
  <text x="220" y="525" text-anchor="middle" class="gene-text">thyA缺失</text>
  
  <!-- Arrows from metabolic bypass -->
  <line x1="220" y1="420" x2="360" y2="320" class="inhibit-arrow"/>
  <line x1="160" y1="500" x2="360" y2="330" class="inhibit-arrow"/>
  <line x1="220" y1="500" x2="360" y2="330" class="inhibit-arrow"/>
  
  <!-- Mechanism 5: Reduced Permeability -->
  <rect x="580" y="420" width="120" height="60" class="target-box"/>
  <text x="640" y="445" text-anchor="middle" class="gene-text">通透性降低</text>
  <text x="640" y="465" text-anchor="middle" class="gene-text">孔蛋白缺失</text>
  
  <rect x="560" y="500" width="80" height="40" class="target-box"/>
  <text x="600" y="525" text-anchor="middle" class="gene-text">OmpF缺失</text>
  
  <rect x="660" y="500" width="80" height="40" class="target-box"/>
  <text x="700" y="525" text-anchor="middle" class="gene-text">膜脂改变</text>
  
  <!-- Arrows from permeability -->
  <line x1="580" y1="420" x2="440" y2="320" class="inhibit-arrow"/>
  <line x1="600" y1="500" x2="440" y2="330" class="inhibit-arrow"/>
  <line x1="700" y1="500" x2="440" y2="330" class="inhibit-arrow"/>
  
  <!-- Synergistic effects arrows -->
  <path d="M 200 300 Q 300 250 400 250" stroke="#9b59b6" stroke-width="3" fill="none" stroke-dasharray="5,5"/>
  <text x="300" y="270" text-anchor="middle" class="small-text" fill="#9b59b6">协同效应</text>
  
  <path d="M 600 300 Q 500 250 400 250" stroke="#9b59b6" stroke-width="3" fill="none" stroke-dasharray="5,5"/>
  
  <!-- Regulatory network -->
  <ellipse cx="400" cy="380" rx="60" ry="30" fill="#f1c40f" stroke="#f39c12" stroke-width="2"/>
  <text x="400" y="385" text-anchor="middle" class="label-text">全局调控</text>
  
  <!-- Regulatory arrows -->
  <line x1="350" y1="370" x2="200" y2="350" class="arrow"/>
  <line x1="450" y1="370" x2="600" y2="350" class="arrow"/>
  <line x1="380" y1="360" x2="300" y2="200" class="arrow"/>
  <line x1="420" y1="360" x2="500" y2="200" class="arrow"/>
  
  <!-- Legend -->
  <text x="50" y="570" class="mechanism-text">抗性机制类型:</text>
  
  <rect x="200" y="555" width="20" height="15" class="enzyme-box"/>
  <text x="230" y="567" class="small-text">酶修饰</text>
  
  <rect x="300" y="555" width="20" height="15" class="target-box"/>
  <text x="330" y="567" class="small-text">靶点改变</text>
  
  <rect x="400" y="555" width="20" height="15" class="efflux-box"/>
  <text x="430" y="567" class="small-text">主动外排</text>
  
  <rect x="500" y="555" width="20" height="15" class="pathway-box"/>
  <text x="530" y="567" class="small-text">代谢旁路</text>
  
  <!-- Mobile genetic elements -->
  <rect x="50" y="50" width="100" height="30" fill="#e8daef" stroke="#8e44ad" stroke-width="2" rx="5"/>
  <text x="100" y="70" text-anchor="middle" class="small-text">质粒传播</text>
  
  <rect x="650" y="50" width="100" height="30" fill="#e8daef" stroke="#8e44ad" stroke-width="2" rx="5"/>
  <text x="700" y="70" text-anchor="middle" class="small-text">转座子跳跃</text>
  
  <!-- Arrows showing horizontal transfer -->
  <line x1="100" y1="80" x2="160" y2="120" class="arrow"/>
  <line x1="700" y1="80" x2="640" y2="120" class="arrow"/>
</svg>