<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #2c3e50; }
      .label { font-family: Arial, sans-serif; font-size: 14px; fill: #34495e; }
      .sublabel { font-family: Arial, sans-serif; font-size: 12px; fill: #7f8c8d; }
      .circular { fill: #27ae60; stroke: #2c3e50; stroke-width: 2; }
      .linear { fill: #8e44ad; stroke: #2c3e50; stroke-width: 2; }
      .example { font-family: Arial, sans-serif; font-size: 11px; fill: #95a5a6; font-style: italic; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="700" height="450" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" class="title">细菌基因组拓扑结构类型</text>
  
  <!-- Root node -->
  <rect x="280" y="60" width="140" height="50" rx="25" fill="#34495e"/>
  <text x="350" y="80" text-anchor="middle" class="label" fill="white">细菌基因组</text>
  <text x="350" y="95" text-anchor="middle" class="label" fill="white">拓扑结构</text>
  
  <!-- Circular chromosome branch -->
  <rect x="120" y="160" width="140" height="50" rx="25" class="circular"/>
  <text x="190" y="180" text-anchor="middle" class="label" fill="white">环型染色体</text>
  <text x="190" y="195" text-anchor="middle" class="sublabel" fill="white">(大多数)</text>
  
  <!-- Linear chromosome branch -->
  <rect x="440" y="160" width="140" height="50" rx="25" class="linear"/>
  <text x="510" y="180" text-anchor="middle" class="label" fill="white">线型染色体</text>
  <text x="510" y="195" text-anchor="middle" class="sublabel" fill="white">(少数)</text>
  
  <!-- Circular subtypes -->
  <rect x="50" y="260" width="120" height="40" rx="20" class="circular"/>
  <text x="110" y="280" text-anchor="middle" class="label" fill="white">单一环型</text>
  <text x="110" y="295" text-anchor="middle" class="example" fill="white">如 E. coli</text>
  
  <rect x="200" y="260" width="120" height="40" rx="20" class="circular"/>
  <text x="260" y="280" text-anchor="middle" class="label" fill="white">多重复制子</text>
  <text x="260" y="295" text-anchor="middle" class="example" fill="white">如 Vibrio</text>
  
  <!-- Linear subtypes -->
  <rect x="380" y="260" width="120" height="40" rx="20" class="linear"/>
  <text x="440" y="280" text-anchor="middle" class="label" fill="white">端粒结构</text>
  <text x="440" y="295" text-anchor="middle" class="example" fill="white">如 Streptomyces</text>
  
  <rect x="530" y="260" width="120" height="40" rx="20" class="linear"/>
  <text x="590" y="280" text-anchor="middle" class="label" fill="white">蛋白帽结构</text>
  <text x="590" y="295" text-anchor="middle" class="example" fill="white">如 Borrelia</text>
  
  <!-- Connecting lines -->
  <line x1="320" y1="110" x2="190" y2="160" stroke="#2c3e50" stroke-width="2"/>
  <line x1="380" y1="110" x2="510" y2="160" stroke="#2c3e50" stroke-width="2"/>
  
  <line x1="160" y1="210" x2="110" y2="260" stroke="#2c3e50" stroke-width="2"/>
  <line x1="220" y1="210" x2="260" y2="260" stroke="#2c3e50" stroke-width="2"/>
  
  <line x1="480" y1="210" x2="440" y2="260" stroke="#2c3e50" stroke-width="2"/>
  <line x1="540" y1="210" x2="590" y2="260" stroke="#2c3e50" stroke-width="2"/>
  
  <!-- Visual representations -->
  <!-- Circular genome representation -->
  <circle cx="110" cy="350" r="25" fill="none" stroke="#27ae60" stroke-width="3"/>
  <text x="110" y="355" text-anchor="middle" class="sublabel">环型</text>
  
  <!-- Linear genome representation -->
  <line x1="440" y1="340" x2="490" y2="340" stroke="#8e44ad" stroke-width="6" stroke-linecap="round"/>
  <circle cx="435" cy="340" r="3" fill="#8e44ad"/>
  <circle cx="495" cy="340" r="3" fill="#8e44ad"/>
  <text x="465" y="355" text-anchor="middle" class="sublabel">线型</text>
  
  <!-- Statistics -->
  <text x="50" y="400" class="label">统计信息：</text>
  <text x="50" y="420" class="sublabel">• 环型染色体：约95%的细菌</text>
  <text x="50" y="435" class="sublabel">• 线型染色体：约5%的细菌（主要是放线菌和螺旋体）</text>
</svg>