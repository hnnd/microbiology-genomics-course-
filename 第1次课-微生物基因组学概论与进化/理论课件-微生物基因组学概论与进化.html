<h2 id="%F0%9F%93%8B-%E6%9C%AC%E6%AC%A1%E8%AF%BE%E7%A8%8B%E5%86%85%E5%AE%B9"><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f4cb.svg" data-marp-twemoji=""/> 本次课程内容</h2>
<div class="columns">
<p><strong>理论部分 (90分钟)</strong></p>
<ul>
<li><img class="emoji" draggable="false" alt="🔬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f52c.svg" data-marp-twemoji=""/> 微生物基因组多样性</li>
<li><img class="emoji" draggable="false" alt="📊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f4ca.svg" data-marp-twemoji=""/> 原核基因组结构特点</li>

<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 基因组与生态适应</li>

<ul>
<li><img class="emoji" draggable="false" alt="💭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f4ad.svg" data-marp-twemoji=""/> 思考讨论</li>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/2753.svg" data-marp-twemoji=""/> 问题解答</li>

</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-class="lead" data-paginate="true" data-background-color="#1e3a8a" data-color="#ffffff" data-theme="gaia" lang="en-US" class="lead" data-marpit-pagination="3" style="--class:lead;--paginate:true;--background-color:#1e3a8a;--color:#ffffff;--theme:gaia;color:#ffffff;background-color:#1e3a8a;background-image:none;" data-marpit-pagination-total="60" data-size="16:9">
<h2 id="%F0%9F%8E%AF-%E5%AD%A6%E4%B9%A0%E7%9B%AE%E6%A0%87"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f3af.svg" data-marp-twemoji=""/> 学习目标</h2>
<p>完成本次课程后，学生应能够：</p>
<ol>
<li><strong>理解</strong> 微生物基因组的多样性特征和结构组织</li>
<li><strong>掌握</strong> 原核基因组与真核基因组的根本差异</li>
<li><strong>应用</strong> 进化理论解释基因组结构变异现象</li>
<li><strong>分析</strong> 环境因子对微生物基因组进化的影响</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-class="lead" data-paginate="true" data-background-color="#1e3a8a" data-color="#ffffff" data-theme="gaia" lang="en-US" class="lead" data-marpit-pagination="4" style="--class:lead;--paginate:true;--background-color:#1e3a8a;--color:#ffffff;--theme:gaia;color:#ffffff;background-color:#1e3a8a;background-image:none;" data-marpit-pagination-total="60" data-size="16:9">
<h1 id="%E7%AC%AC%E4%B8%80%E9%83%A8%E5%88%86">第一部分</h1>
<h2 id="%E5%BE%AE%E7%94%9F%E7%89%A9%E5%9F%BA%E5%9B%A0%E7%BB%84%E5%A4%9A%E6%A0%B7%E6%80%A7">微生物基因组多样性</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-class="lead" data-paginate="true" data-background-color="#1e3a8a" data-color="#ffffff" data-theme="gaia" lang="en-US" class="lead" data-marpit-pagination="5" style="--class:lead;--paginate:true;--background-color:#1e3a8a;--color:#ffffff;--theme:gaia;color:#ffffff;background-color:#1e3a8a;background-image:none;" data-marpit-pagination-total="60" data-size="16:9">
<h2 id="%F0%9F%93%96-%E5%9F%BA%E5%9B%A0%E7%BB%84%E5%A4%A7%E5%B0%8F%E7%9A%84%E6%83%8A%E4%BA%BA%E5%8F%98%E5%BC%82"><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f4d6.svg" data-marp-twemoji=""/> 基因组大小的惊人变异</h2>
<h3 id="%E6%9E%81%E7%AB%AF%E8%8C%83%E5%9B%B4%E5%AF%B9%E6%AF%94">极端范围对比</h3>
<ul>
<li><strong>最小基因组</strong>：<em>Carsonella ruddii</em> (~160 kb, 182个基因)</li>
<li><strong>最大基因组</strong>：<em>Sorangium cellulosum</em> (~13 Mb, &gt;9,000个基因)</li>
<li><strong>典型范围</strong>：大多数自由生活细菌 2-8 Mb</li>
</ul>
<h3 id="%E5%9F%BA%E5%9B%A0%E7%BB%84%E5%A4%A7%E5%B0%8F%E5%BD%B1%E5%93%8D%E5%9B%A0%E7%B4%A0">基因组大小影响因素</h3>
<div class="highlight">
生活方式是决定基因组大小的关键因素
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-class="lead" data-paginate="true" data-background-color="#1e3a8a" data-color="#ffffff" data-theme="gaia" lang="en-US" class="lead" data-marpit-pagination="6" style="--class:lead;--paginate:true;--background-color:#1e3a8a;--color:#ffffff;--theme:gaia;color:#ffffff;background-color:#1e3a8a;background-image:none;" data-marpit-pagination-total="60" data-size="16:9">
<h2 id="%F0%9F%94%AC-%E5%9F%BA%E5%9B%A0%E5%AF%86%E5%BA%A6%E4%B8%8E%E7%BC%96%E7%A0%81%E6%95%88%E7%8E%87"><img class="emoji" draggable="false" alt="🔬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f52c.svg" data-marp-twemoji=""/> 基因密度与编码效率</h2>
<h3 id="%E7%BC%96%E7%A0%81%E5%AF%86%E5%BA%A6%E7%BB%9F%E8%AE%A1">编码密度统计</h3>
<p><img src="images/genome_coding_density.svg" alt="微生物基因组编码密度分布" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-class="lead" data-paginate="true" data-background-color="#1e3a8a" data-color="#ffffff" data-theme="gaia" lang="en-US" class="lead" data-marpit-pagination="7" style="--class:lead;--paginate:true;--background-color:#1e3a8a;--color:#ffffff;--theme:gaia;color:#ffffff;background-color:#1e3a8a;background-image:none;" data-marpit-pagination-total="60" data-size="16:9">
<h3 id="%E7%BC%96%E7%A0%81%E6%95%88%E7%8E%87%E7%89%B9%E5%BE%81">编码效率特征</h3>
<ul>
<li><strong>基因间隔区</strong>：通常 &lt; 100 bp</li>
<li><strong>重叠基因</strong>：相邻基因可重叠1-4个核苷酸</li>
<li><strong>操纵子结构</strong>：多基因共转录单元</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-class="lead" data-paginate="true" data-background-color="#1e3a8a" data-color="#ffffff" data-theme="gaia" lang="en-US" class="lead" data-marpit-pagination="8" style="--class:lead;--paginate:true;--background-color:#1e3a8a;--color:#ffffff;--theme:gaia;color:#ffffff;background-color:#1e3a8a;background-image:none;" data-marpit-pagination-total="60" data-size="16:9">
<h2 id="%F0%9F%93%8A-gc%E5%90%AB%E9%87%8F%E4%B8%8E%E7%B3%BB%E7%BB%9F%E5%8F%91%E8%82%B2"><img class="emoji" draggable="false" alt="📊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f4ca.svg" data-marp-twemoji=""/> GC含量与系统发育</h2>
<table>
<thead>
<tr>
<th>微生物类群</th>
<th>GC含量范围</th>
<th>典型代表</th>
</tr>
</thead>
<tbody>
<tr>
<td>低GC革兰氏阳性菌</td>
<td>25-50%</td>
<td><em>Clostridium</em>, <em>Bacillus</em></td>
</tr>
<tr>
<td>高GC革兰氏阳性菌</td>
<td>55-75%</td>
<td><em>Streptomyces</em>, <em>Mycobacterium</em></td>
</tr>
<tr>
<td>变形菌门</td>
<td>35-70%</td>
<td><em>E. coli</em>, <em>Pseudomonas</em></td>
</tr>
<tr>
<td>极端环境菌</td>
<td>30-68%</td>
<td><em>Thermotoga</em>, <em>Deinococcus</em></td>
</tr>
</tbody>
</table>
<h3 id="gc%E5%90%AB%E9%87%8F%E7%9A%84%E7%94%9F%E6%80%81%E6%84%8F%E4%B9%89">GC含量的生态意义</h3>
<div class="small-text">
<p><em>高GC含量通常与高温环境适应相关，但也受系统发育约束</em></p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-class="lead" data-paginate="true" data-background-color="#1e3a8a" data-color="#ffffff" data-theme="gaia" lang="en-US" class="lead" data-marpit-pagination="9" style="--class:lead;--paginate:true;--background-color:#1e3a8a;--color:#ffffff;--theme:gaia;color:#ffffff;background-color:#1e3a8a;background-image:none;" data-marpit-pagination-total="60" data-size="16:9">
<h2 id="%E2%9A%99%EF%B8%8F-%E7%BA%BF%E5%9E%8Bvs%E7%8E%AF%E5%9E%8B%E5%9F%BA%E5%9B%A0%E7%BB%84%E7%BB%93%E6%9E%84"><img class="emoji" draggable="false" alt="⚙️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/2699.svg" data-marp-twemoji=""/> 线型vs环型基因组结构</h2>
<h3 id="%E5%9F%BA%E5%9B%A0%E7%BB%84%E6%8B%93%E6%89%91%E7%BB%93%E6%9E%84">基因组拓扑结构</h3>
<p><img src="images/genome_topology.svg" alt="细菌基因组拓扑结构类型" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-class="lead" data-paginate="true" data-background-color="#1e3a8a" data-color="#ffffff" data-theme="gaia" lang="en-US" class="lead" data-marpit-pagination="10" style="--class:lead;--paginate:true;--background-color:#1e3a8a;--color:#ffffff;--theme:gaia;color:#ffffff;background-color:#1e3a8a;background-image:none;" data-marpit-pagination-total="60" data-size="16:9">
<h3 id="%E7%BA%BF%E5%9E%8B%E5%9F%BA%E5%9B%A0%E7%BB%84%E7%89%B9%E4%BE%8B">线型基因组特例</h3>
<ul>
<li><strong>链霉菌属</strong>：线型染色体 + 线型质粒</li>
<li><strong>博德特氏菌</strong>：线型染色体系统</li>
<li><strong>进化意义</strong>：可能与DNA修复机制相关</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-class="lead" data-paginate="true" data-background-color="#1e3a8a" data-color="#ffffff" data-theme="gaia" lang="en-US" class="lead" data-marpit-pagination="11" style="--class:lead;--paginate:true;--background-color:#1e3a8a;--color:#ffffff;--theme:gaia;color:#ffffff;background-color:#1e3a8a;background-image:none;" data-marpit-pagination-total="60" data-size="16:9">

</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-class="lead" data-paginate="true" data-background-color="#1e3a8a" data-color="#ffffff" data-theme="gaia" lang="en-US" class="lead" data-marpit-pagination="15" style="--class:lead;--paginate:true;--background-color:#1e3a8a;--color:#ffffff;--theme:gaia;color:#ffffff;background-color:#1e3a8a;background-image:none;" data-marpit-pagination-total="60" data-size="16:9">

基因间距: 通常1-20 bp
</code></pre>
</div>

<ul>
<li>rRNA操纵子：通常3-7个拷贝</li>
<li>tRNA基因：40-100个拷贝</li>
<li>CRISPR阵列：适应性免疫系统</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-class="lead" data-paginate="true" data-background-color="#1e3a8a" data-color="#ffffff" data-theme="gaia" lang="en-US" class="lead" data-marpit-pagination="19" style="--class:lead;--paginate:true;--background-color:#1e3a8a;--color:#ffffff;--theme:gaia;color:#ffffff;background-color:#1e3a8a;background-image:none;" data-marpit-pagination-total="60" data-size="16:9">
<p><strong>散在重复</strong></p>
<ul>
<li>插入序列（IS）：0.5-5%基因组</li>
<li>转座子：完整或退化形式</li>
<li>反向重复：回文结构</li>
</ul>

<div class="columns">
<p><strong>必需功能质粒</strong></p>
<ul>
<li>大型线型质粒</li>
<li>携带必需基因</li>
<li>类似次级染色体</li>
</ul>
<p><strong>附加功能质粒</strong></p>
<ul>
<li>抗性基因载体</li>
<li>代谢功能扩展</li>
<li>毒力因子携带</li>
</ul>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-class="lead" data-paginate="true" data-background-color="#1e3a8a" data-color="#ffffff" data-theme="gaia" lang="en-US" class="lead" data-marpit-pagination="21" style="--class:lead;--paginate:true;--background-color:#1e3a8a;--color:#ffffff;--theme:gaia;color:#ffffff;background-color:#1e3a8a;background-image:none;" data-marpit-pagination-total="60" data-size="16:9">

<li><strong>切除事件</strong>：染色体基因转移到质粒</li>
<li><strong>进化意义</strong>：基因组灵活性和适应性</li>
</ul>
</section>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-class="lead" data-paginate="true" data-background-color="#1e3a8a" data-color="#ffffff" data-theme="gaia" lang="en-US" class="lead" data-marpit-pagination="23" style="--class:lead;--paginate:true;--background-color:#1e3a8a;--color:#ffffff;--theme:gaia;color:#ffffff;background-color:#1e3a8a;background-image:none;" data-marpit-pagination-total="60" data-size="16:9">

<h3 id="hgt%E7%9A%84%E4%B8%89%E7%A7%8D%E6%9C%BA%E5%88%B6">HGT的三种机制</h3>
<ul>
<li><strong>转化（Transformation）</strong>
<ul>
<li>自然感受态细胞</li>
<li>外源DNA直接摄取</li>
<li>同源重组整合</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-class="lead" data-paginate="true" data-background-color="#1e3a8a" data-color="#ffffff" data-theme="gaia" lang="en-US" class="lead" data-marpit-pagination="24" style="--class:lead;--paginate:true;--background-color:#1e3a8a;--color:#ffffff;--theme:gaia;color:#ffffff;background-color:#1e3a8a;background-image:none;" data-marpit-pagination-total="60" data-size="16:9">
<ul>
<li><strong>转导（Transduction）</strong>
<ul>
<li>噬菌体介导转移</li>
<li>广义转导vs专一转导</li>
<li>跨种属基因转移</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-class="lead" data-paginate="true" data-background-color="#1e3a8a" data-color="#ffffff" data-theme="gaia" lang="en-US" class="lead" data-marpit-pagination="25" style="--class:lead;--paginate:true;--background-color:#1e3a8a;--color:#ffffff;--theme:gaia;color:#ffffff;background-color:#1e3a8a;background-image:none;" data-marpit-pagination-total="60" data-size="16:9">
<ul>
<li><strong>接合（Conjugation）</strong>
<ul>
<li>质粒介导转移</li>
<li>直接细胞接触</li>
<li>可移动遗传元件</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-class="lead" data-paginate="true" data-background-color="#1e3a8a" data-color="#ffffff" data-theme="gaia" lang="en-US" class="lead" data-marpit-pagination="26" style="--class:lead;--paginate:true;--background-color:#1e3a8a;--color:#ffffff;--theme:gaia;color:#ffffff;background-color:#1e3a8a;background-image:none;" data-marpit-pagination-total="60" data-size="16:9">

异常GC含量、密码子使用偏好性、系统发育不一致性

</section>

<h3 id="%E5%9F%BA%E5%9B%A0%E7%BB%84%E8%BF%9B%E5%8C%96%E6%96%B9%E5%90%91">基因组进化方向</h3>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-class="lead" data-paginate="true" data-background-color="#1e3a8a" data-color="#ffffff" data-theme="gaia" lang="en-US" class="lead" data-marpit-pagination="28" style="--class:lead;--paginate:true;--background-color:#1e3a8a;--color:#ffffff;--theme:gaia;color:#ffffff;background-color:#1e3a8a;background-image:none;" data-marpit-pagination-total="60" data-size="16:9">
<h3 id="%E5%9F%BA%E5%9B%A0%E7%BC%BA%E5%A4%B1%E7%9A%84%E5%88%86%E5%AD%90%E6%9C%BA%E5%88%B6">基因缺失的分子机制</h3>
<ul>
<li><strong>同源重组</strong>：重复序列介导的缺失</li>
<li><strong>滑动复制</strong>：复制滑动导致缺失</li>
<li><strong>转座介导</strong>：转座子插入破坏基因</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-class="lead" data-paginate="true" data-background-color="#1e3a8a" data-color="#ffffff" data-theme="gaia" lang="en-US" class="lead" data-marpit-pagination="29" style="--class:lead;--paginate:true;--background-color:#1e3a8a;--color:#ffffff;--theme:gaia;color:#ffffff;background-color:#1e3a8a;background-image:none;" data-marpit-pagination-total="60" data-size="16:9">
<h2 id="%E2%9A%99%EF%B8%8F-%E5%9F%BA%E5%9B%A0%E7%BB%84%E9%87%8D%E6%8E%92%E6%9C%BA%E5%88%B6"><img class="emoji" draggable="false" alt="⚙️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/2699.svg" data-marp-twemoji=""/> 基因组重排机制</h2>
<h3 id="%E9%87%8D%E6%8E%92%E7%B1%BB%E5%9E%8B%E4%B8%8E%E6%9C%BA%E5%88%B6">重排类型与机制</h3>
<p><strong>大片段重排</strong></p>
<ul>
<li>倒位：回文重复介导</li>
<li>易位：非同源重组</li>
<li>重复：不等交换</li>
</ul>
</section>

<h2 id="%F0%9F%8E%AF-%E5%85%B3%E9%94%AE%E8%A6%81%E7%82%B9%E5%9B%9E%E9%A1%BE"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f3af.svg" data-marp-twemoji=""/> 关键要点回顾</h2>
<h3 id="%E6%A0%B8%E5%BF%83%E6%A6%82%E5%BF%B5">核心概念</h3>
<ol>
<li><strong>基因组多样性</strong> - 大小、结构、组成的巨大变异</li>
<li><strong>结构特征</strong> - 操纵子、紧凑性、重复序列组织</li>
<li><strong>进化机制</strong> - HGT、重排、缺失获得的动态过程</li>
<li><strong>生态适应</strong> - 环境塑造基因组结构和功能</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-class="lead" data-paginate="true" data-background-color="#1e3a8a" data-color="#ffffff" data-theme="gaia" lang="en-US" class="lead" data-marpit-pagination="50" style="--class:lead;--paginate:true;--background-color:#1e3a8a;--color:#ffffff;--theme:gaia;color:#ffffff;background-color:#1e3a8a;background-image:none;" data-marpit-pagination-total="60" data-size="16:9">
<h3 id="%E6%8A%80%E6%9C%AF%E6%96%B9%E6%B3%95">技术方法</h3>
<ul>
<li>基因组比较分析：识别进化模式</li>
<li>系统发育分析：追踪进化历史</li>
<li>功能注释：理解适应机制</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-class="lead" data-paginate="true" data-background-color="#1e3a8a" data-color="#ffffff" data-theme="gaia" lang="en-US" class="lead" data-marpit-pagination="51" style="--class:lead;--paginate:true;--background-color:#1e3a8a;--color:#ffffff;--theme:gaia;color:#ffffff;background-color:#1e3a8a;background-image:none;" data-marpit-pagination-total="60" data-size="16:9">
