<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="500" height="300" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="250" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">
    严格分子钟模型
  </text>
  
  <!-- Time axis -->
  <line x1="50" y1="250" x2="450" y2="250" stroke="#333" stroke-width="2"/>
  <text x="250" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
    时间 (百万年前)
  </text>
  
  <!-- Time markers -->
  <line x1="100" y1="245" x2="100" y2="255" stroke="#333" stroke-width="1"/>
  <text x="100" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">100</text>
  
  <line x1="200" y1="245" x2="200" y2="255" stroke="#333" stroke-width="1"/>
  <text x="200" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">50</text>
  
  <line x1="350" y1="245" x2="350" y2="255" stroke="#333" stroke-width="1"/>
  <text x="350" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">10</text>
  
  <line x1="425" y1="245" x2="425" y2="255" stroke="#333" stroke-width="1"/>
  <text x="425" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">0</text>
  
  <!-- Tree structure with equal branch lengths -->
  <!-- Root -->
  <circle cx="100" cy="150" r="4" fill="#1976D2"/>
  
  <!-- First split -->
  <line x1="100" y1="150" x2="200" y2="100" stroke="#1976D2" stroke-width="3"/>
  <line x1="100" y1="150" x2="200" y2="200" stroke="#1976D2" stroke-width="3"/>
  <circle cx="200" cy="100" r="3" fill="#1976D2"/>
  <circle cx="200" cy="200" r="3" fill="#1976D2"/>
  
  <!-- Second splits -->
  <line x1="200" y1="100" x2="350" y2="70" stroke="#1976D2" stroke-width="3"/>
  <line x1="200" y1="100" x2="350" y2="130" stroke="#1976D2" stroke-width="3"/>
  <line x1="200" y1="200" x2="350" y2="170" stroke="#1976D2" stroke-width="3"/>
  <line x1="200" y1="200" x2="350" y2="230" stroke="#1976D2" stroke-width="3"/>
  
  <!-- Terminal branches -->
  <line x1="350" y1="70" x2="425" y2="70" stroke="#1976D2" stroke-width="3"/>
  <line x1="350" y1="130" x2="425" y2="130" stroke="#1976D2" stroke-width="3"/>
  <line x1="350" y1="170" x2="425" y2="170" stroke="#1976D2" stroke-width="3"/>
  <line x1="350" y1="230" x2="425" y2="230" stroke="#1976D2" stroke-width="3"/>
  
  <!-- Terminal nodes -->
  <circle cx="425" cy="70" r="3" fill="#4CAF50"/>
  <circle cx="425" cy="130" r="3" fill="#4CAF50"/>
  <circle cx="425" cy="170" r="3" fill="#4CAF50"/>
  <circle cx="425" cy="230" r="3" fill="#4CAF50"/>
  
  <!-- Species labels -->
  <text x="440" y="75" font-family="Arial, sans-serif" font-size="10" fill="#333">物种A</text>
  <text x="440" y="135" font-family="Arial, sans-serif" font-size="10" fill="#333">物种B</text>
  <text x="440" y="175" font-family="Arial, sans-serif" font-size="10" fill="#333">物种C</text>
  <text x="440" y="235" font-family="Arial, sans-serif" font-size="10" fill="#333">物种D</text>
  
  <!-- Clock rate annotation -->
  <text x="50" y="50" font-family="Arial, sans-serif" font-size="12" fill="#333" font-weight="bold">
    恒定进化速率
  </text>
  <text x="50" y="70" font-family="Arial, sans-serif" font-size="10" fill="#666">
    所有谱系相同的替换速率
  </text>
  
  <!-- Rate indicator -->
  <rect x="300" y="40" width="150" height="30" fill="#FFF3E0" stroke="#FF9800" stroke-width="1" rx="5"/>
  <text x="375" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">
    速率 = 常数
  </text>
</svg>