<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="300" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">
    基因组重排类型
  </text>
  
  <!-- Original genome -->
  <g transform="translate(50, 50)">
    <text x="250" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
      原始基因组
    </text>
    
    <!-- Gene blocks -->
    <rect x="50" y="30" width="40" height="20" fill="#4CAF50" stroke="#333" stroke-width="1"/>
    <text x="70" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">A</text>
    
    <rect x="100" y="30" width="40" height="20" fill="#2196F3" stroke="#333" stroke-width="1"/>
    <text x="120" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">B</text>
    
    <rect x="150" y="30" width="40" height="20" fill="#FF9800" stroke="#333" stroke-width="1"/>
    <text x="170" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">C</text>
    
    <rect x="200" y="30" width="40" height="20" fill="#9C27B0" stroke="#333" stroke-width="1"/>
    <text x="220" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">D</text>
    
    <rect x="250" y="30" width="40" height="20" fill="#F44336" stroke="#333" stroke-width="1"/>
    <text x="270" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">E</text>
    
    <rect x="300" y="30" width="40" height="20" fill="#607D8B" stroke="#333" stroke-width="1"/>
    <text x="320" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">F</text>
  </g>
  
  <!-- Inversion -->
  <g transform="translate(50, 120)">
    <text x="100" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
      倒位 (Inversion)
    </text>
    
    <!-- Inverted genome -->
    <rect x="50" y="30" width="40" height="20" fill="#4CAF50" stroke="#333" stroke-width="1"/>
    <text x="70" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">A</text>
    
    <!-- Inverted region -->
    <rect x="100" y="30" width="40" height="20" fill="#9C27B0" stroke="#FF5722" stroke-width="2"/>
    <text x="120" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">D</text>
    
    <rect x="150" y="30" width="40" height="20" fill="#FF9800" stroke="#FF5722" stroke-width="2"/>
    <text x="170" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">C</text>
    
    <rect x="200" y="30" width="40" height="20" fill="#2196F3" stroke="#FF5722" stroke-width="2"/>
    <text x="220" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">B</text>
    
    <rect x="250" y="30" width="40" height="20" fill="#F44336" stroke="#333" stroke-width="1"/>
    <text x="270" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">E</text>
    
    <rect x="300" y="30" width="40" height="20" fill="#607D8B" stroke="#333" stroke-width="1"/>
    <text x="320" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">F</text>
    
    <!-- Arrow indicating inversion -->
    <path d="M 120 60 Q 170 80 220 60" stroke="#FF5722" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="170" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#FF5722">倒位</text>
  </g>
  
  <!-- Translocation -->
  <g transform="translate(50, 220)">
    <text x="100" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
      易位 (Translocation)
    </text>
    
    <!-- Translocated genome -->
    <rect x="50" y="30" width="40" height="20" fill="#4CAF50" stroke="#333" stroke-width="1"/>
    <text x="70" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">A</text>
    
    <rect x="100" y="30" width="40" height="20" fill="#F44336" stroke="#FF5722" stroke-width="2"/>
    <text x="120" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">E</text>
    
    <rect x="150" y="30" width="40" height="20" fill="#FF9800" stroke="#333" stroke-width="1"/>
    <text x="170" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">C</text>
    
    <rect x="200" y="30" width="40" height="20" fill="#9C27B0" stroke="#333" stroke-width="1"/>
    <text x="220" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">D</text>
    
    <rect x="250" y="30" width="40" height="20" fill="#2196F3" stroke="#FF5722" stroke-width="2"/>
    <text x="270" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">B</text>
    
    <rect x="300" y="30" width="40" height="20" fill="#607D8B" stroke="#333" stroke-width="1"/>
    <text x="320" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">F</text>
    
    <!-- Arrows indicating translocation -->
    <path d="M 120 60 Q 160 80 270 60" stroke="#FF5722" stroke-width="2" fill="none"/>
    <path d="M 270 60 Q 160 80 120 60" stroke="#FF5722" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="195" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#FF5722">易位</text>
  </g>
  
  <!-- Duplication -->
  <g transform="translate(50, 320)">
    <text x="100" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
      重复 (Duplication)
    </text>
    
    <!-- Duplicated genome -->
    <rect x="50" y="30" width="40" height="20" fill="#4CAF50" stroke="#333" stroke-width="1"/>
    <text x="70" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">A</text>
    
    <rect x="100" y="30" width="40" height="20" fill="#2196F3" stroke="#333" stroke-width="1"/>
    <text x="120" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">B</text>
    
    <rect x="150" y="30" width="40" height="20" fill="#FF9800" stroke="#FF5722" stroke-width="2"/>
    <text x="170" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">C</text>
    
    <rect x="200" y="30" width="40" height="20" fill="#FF9800" stroke="#FF5722" stroke-width="2"/>
    <text x="220" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">C</text>
    
    <rect x="250" y="30" width="40" height="20" fill="#9C27B0" stroke="#333" stroke-width="1"/>
    <text x="270" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">D</text>
    
    <rect x="300" y="30" width="40" height="20" fill="#F44336" stroke="#333" stroke-width="1"/>
    <text x="320" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">E</text>
    
    <rect x="350" y="30" width="40" height="20" fill="#607D8B" stroke="#333" stroke-width="1"/>
    <text x="370" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">F</text>
    
    <!-- Plus sign indicating duplication -->
    <text x="195" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#FF5722" font-weight="bold">+</text>
    <text x="195" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#FF5722">重复</text>
  </g>
  
  <!-- Deletion -->
  <g transform="translate(50, 420)">
    <text x="100" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
      缺失 (Deletion)
    </text>
    
    <!-- Deleted genome -->
    <rect x="50" y="30" width="40" height="20" fill="#4CAF50" stroke="#333" stroke-width="1"/>
    <text x="70" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">A</text>
    
    <rect x="100" y="30" width="40" height="20" fill="#2196F3" stroke="#333" stroke-width="1"/>
    <text x="120" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">B</text>
    
    <!-- Gap indicating deletion -->
    <rect x="150" y="35" width="40" height="10" fill="none" stroke="#FF5722" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="170" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#FF5722">缺失</text>
    
    <rect x="200" y="30" width="40" height="20" fill="#9C27B0" stroke="#333" stroke-width="1"/>
    <text x="220" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">D</text>
    
    <rect x="250" y="30" width="40" height="20" fill="#F44336" stroke="#333" stroke-width="1"/>
    <text x="270" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">E</text>
    
    <rect x="300" y="30" width="40" height="20" fill="#607D8B" stroke="#333" stroke-width="1"/>
    <text x="320" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">F</text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FF5722"/>
    </marker>
  </defs>
</svg>