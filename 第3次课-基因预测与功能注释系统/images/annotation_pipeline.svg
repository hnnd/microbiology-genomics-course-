<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #2d3748; }
      .label { font-family: Arial, sans-serif; font-size: 12px; fill: #4a5568; }
      .process { fill: #3182ce; stroke: #2c5282; stroke-width: 2; }
      .database { fill: #38a169; stroke: #2f855a; stroke-width: 2; }
      .output { fill: #d69e2e; stroke: #c53030; stroke-width: 2; }
      .qc { fill: #805ad5; stroke: #6b46c1; stroke-width: 2; }
      .arrow { stroke: #4a5568; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .text-white { fill: white; font-weight: bold; }
    </style>
  </defs>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a5568"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" class="title" text-anchor="middle">基因组自动注释流水线</text>
  
  <!-- Input -->
  <rect x="50" y="60" width="120" height="40" class="output" rx="5"/>
  <text x="110" y="85" class="text-white" text-anchor="middle">基因组序列</text>
  
  <!-- Gene Prediction -->
  <path d="M 170 80 L 220 80" class="arrow"/>
  <rect x="220" y="60" width="120" height="40" class="process" rx="5"/>
  <text x="280" y="85" class="text-white" text-anchor="middle">基因预测</text>
  
  <!-- Gene Prediction Tools -->
  <rect x="200" y="120" width="80" height="25" fill="#e2e8f0" rx="3"/>
  <text x="240" y="137" class="label" text-anchor="middle">Prodigal</text>
  <rect x="290" y="120" width="80" height="25" fill="#e2e8f0" rx="3"/>
  <text x="330" y="137" class="label" text-anchor="middle">GeneMark</text>
  
  <!-- Functional Annotation -->
  <path d="M 340 80 L 390 80" class="arrow"/>
  <rect x="390" y="60" width="120" height="40" class="process" rx="5"/>
  <text x="450" y="85" class="text-white" text-anchor="middle">功能注释</text>
  
  <!-- Databases -->
  <rect x="550" y="40" width="80" height="30" class="database" rx="3"/>
  <text x="590" y="60" class="text-white" text-anchor="middle">UniProt</text>
  <rect x="550" y="80" width="80" height="30" class="database" rx="3"/>
  <text x="590" y="100" class="text-white" text-anchor="middle">KEGG</text>
  <rect x="550" y="120" width="80" height="30" class="database" rx="3"/>
  <text x="590" y="140" class="text-white" text-anchor="middle">COG</text>
  
  <!-- Database arrows -->
  <path d="M 510 70 L 550 55" class="arrow"/>
  <path d="M 510 80 L 550 95" class="arrow"/>
  <path d="M 510 90 L 550 135" class="arrow"/>
  
  <!-- Special Gene Prediction Branch -->
  <path d="M 280 100 L 280 180" class="arrow"/>
  <rect x="220" y="180" width="120" height="40" class="process" rx="5"/>
  <text x="280" y="205" class="text-white" text-anchor="middle">特殊基因预测</text>
  
  <!-- Special Gene Tools -->
  <rect x="180" y="240" width="60" height="25" fill="#e2e8f0" rx="3"/>
  <text x="210" y="257" class="label" text-anchor="middle">SignalP</text>
  <rect x="250" y="240" width="60" height="25" fill="#e2e8f0" rx="3"/>
  <text x="280" y="257" class="label" text-anchor="middle">TMHMM</text>
  <rect x="320" y="240" width="60" height="25" fill="#e2e8f0" rx="3"/>
  <text x="350" y="257" class="label" text-anchor="middle">tRNAscan</text>
  
  <!-- ncRNA Prediction Branch -->
  <path d="M 450 100 L 450 180" class="arrow"/>
  <rect x="390" y="180" width="120" height="40" class="process" rx="5"/>
  <text x="450" y="205" class="text-white" text-anchor="middle">非编码RNA</text>
  
  <!-- ncRNA Tools -->
  <rect x="370" y="240" width="60" height="25" fill="#e2e8f0" rx="3"/>
  <text x="400" y="257" class="label" text-anchor="middle">RNAmmer</text>
  <rect x="440" y="240" width="60" height="25" fill="#e2e8f0" rx="3"/>
  <text x="470" y="257" class="label" text-anchor="middle">Infernal</text>
  
  <!-- Integration -->
  <path d="M 280 220 L 320 280" class="arrow"/>
  <path d="M 450 220 L 410 280" class="arrow"/>
  <path d="M 450 100 L 365 280" class="arrow"/>
  
  <rect x="300" y="280" width="120" height="40" class="process" rx="5"/>
  <text x="360" y="305" class="text-white" text-anchor="middle">结果整合</text>
  
  <!-- Quality Control -->
  <path d="M 420 300 L 470 300" class="arrow"/>
  <rect x="470" y="280" width="120" height="40" class="qc" rx="5"/>
  <text x="530" y="305" class="text-white" text-anchor="middle">质量控制</text>
  
  <!-- QC Metrics -->
  <rect x="450" y="340" width="80" height="25" fill="#e2e8f0" rx="3"/>
  <text x="490" y="357" class="label" text-anchor="middle">完整性检查</text>
  <rect x="540" y="340" width="80" height="25" fill="#e2e8f0" rx="3"/>
  <text x="580" y="357" class="label" text-anchor="middle">一致性验证</text>
  
  <!-- Final Output -->
  <path d="M 530 320 L 530 380" class="arrow"/>
  <rect x="470" y="380" width="120" height="40" class="output" rx="5"/>
  <text x="530" y="405" class="text-white" text-anchor="middle">注释结果</text>
  
  <!-- Output Formats -->
  <rect x="430" y="440" width="60" height="25" fill="#e2e8f0" rx="3"/>
  <text x="460" y="457" class="label" text-anchor="middle">GFF3</text>
  <rect x="500" y="440" width="60" height="25" fill="#e2e8f0" rx="3"/>
  <text x="530" y="457" class="label" text-anchor="middle">GenBank</text>
  <rect x="570" y="440" width="60" height="25" fill="#e2e8f0" rx="3"/>
  <text x="600" y="457" class="label" text-anchor="middle">EMBL</text>
  
  <!-- Statistics -->
  <rect x="650" y="280" width="120" height="40" class="output" rx="5"/>
  <text x="710" y="305" class="text-white" text-anchor="middle">统计报告</text>
  <path d="M 590 300 L 650 300" class="arrow"/>
  
  <!-- Statistics Details -->
  <text x="710" y="340" class="label" text-anchor="middle">• 基因数量统计</text>
  <text x="710" y="355" class="label" text-anchor="middle">• 功能分类分布</text>
  <text x="710" y="370" class="label" text-anchor="middle">• 注释覆盖率</text>
  <text x="710" y="385" class="label" text-anchor="middle">• 质量评估指标</text>
  
  <!-- Legend -->
  <text x="50" y="520" class="title">流程说明：</text>
  <rect x="50" y="540" width="15" height="15" class="process"/>
  <text x="70" y="552" class="label">处理步骤</text>
  <rect x="150" y="540" width="15" height="15" class="database"/>
  <text x="170" y="552" class="label">参考数据库</text>
  <rect x="250" y="540" width="15" height="15" class="qc"/>
  <text x="270" y="552" class="label">质量控制</text>
  <rect x="350" y="540" width="15" height="15" class="output"/>
  <text x="370" y="552" class="label">输入/输出</text>
</svg>