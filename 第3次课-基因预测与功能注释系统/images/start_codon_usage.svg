<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #2d3748; }
      .label { font-family: Arial, sans-serif; font-size: 14px; fill: #4a5568; }
      .bar-atg { fill: #3182ce; }
      .bar-gtg { fill: #38a169; }
      .bar-ttg { fill: #d69e2e; }
      .percentage { font-family: Arial, sans-serif; font-size: 12px; fill: white; font-weight: bold; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="300" y="30" class="title" text-anchor="middle">起始密码子使用频率分布</text>
  
  <!-- ATG Bar -->
  <rect x="100" y="80" width="360" height="60" class="bar-atg" rx="5"/>
  <text x="120" y="115" class="percentage">ATG: 85-90%</text>
  <text x="50" y="115" class="label">ATG</text>
  
  <!-- GTG Bar -->
  <rect x="100" y="160" width="48" height="60" class="bar-gtg" rx="5"/>
  <text x="120" y="195" class="percentage">8-12%</text>
  <text x="50" y="195" class="label">GTG</text>
  
  <!-- TTG Bar -->
  <rect x="100" y="240" width="20" height="60" class="bar-ttg" rx="5"/>
  <text x="130" y="275" class="percentage">2-5%</text>
  <text x="50" y="275" class="label">TTG</text>
  
  <!-- Legend -->
  <text x="100" y="340" class="label">识别难度：</text>
  <rect x="200" y="330" width="15" height="15" class="bar-atg"/>
  <text x="220" y="342" class="label">低</text>
  <rect x="260" y="330" width="15" height="15" class="bar-gtg"/>
  <text x="280" y="342" class="label">中</text>
  <rect x="320" y="330" width="15" height="15" class="bar-ttg"/>
  <text x="340" y="342" class="label">高</text>
  
  <!-- Scale -->
  <line x1="100" y1="320" x2="460" y2="320" stroke="#e2e8f0" stroke-width="1"/>
  <text x="100" y="335" class="label" font-size="10px">0%</text>
  <text x="280" y="335" class="label" font-size="10px">50%</text>
  <text x="460" y="335" class="label" font-size="10px">100%</text>
</svg>