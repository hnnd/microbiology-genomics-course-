<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #34495e; }
      .label { font-family: Arial, sans-serif; font-size: 11px; fill: #2c3e50; }
      .gene { fill: #3498db; stroke: #2980b9; stroke-width: 1; }
      .gene-alt { fill: #e74c3c; stroke: #c0392b; stroke-width: 1; }
      .gene-new { fill: #2ecc71; stroke: #27ae60; stroke-width: 1; }
      .chromosome { stroke: #34495e; stroke-width: 3; fill: none; }
      .arrow { stroke: #7f8c8d; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7f8c8d" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" class="title">基因组重排类型示意图</text>
  
  <!-- Inversion -->
  <text x="50" y="60" class="subtitle">1. 倒位 (Inversion)</text>
  
  <!-- Original -->
  <text x="50" y="85" class="label">原始:</text>
  <line x1="100" y1="80" x2="350" y2="80" class="chromosome"/>
  <rect x="120" y="70" width="20" height="20" class="gene"/>
  <text x="130" y="85" text-anchor="middle" class="label" fill="white">A</text>
  <rect x="150" y="70" width="20" height="20" class="gene"/>
  <text x="160" y="85" text-anchor="middle" class="label" fill="white">B</text>
  <rect x="180" y="70" width="20" height="20" class="gene"/>
  <text x="190" y="85" text-anchor="middle" class="label" fill="white">C</text>
  <rect x="210" y="70" width="20" height="20" class="gene"/>
  <text x="220" y="85" text-anchor="middle" class="label" fill="white">D</text>
  <rect x="240" y="70" width="20" height="20" class="gene"/>
  <text x="250" y="85" text-anchor="middle" class="label" fill="white">E</text>
  
  <!-- After inversion -->
  <text x="50" y="115" class="label">倒位后:</text>
  <line x1="100" y1="110" x2="350" y2="110" class="chromosome"/>
  <rect x="120" y="100" width="20" height="20" class="gene"/>
  <text x="130" y="115" text-anchor="middle" class="label" fill="white">A</text>
  <rect x="150" y="100" width="20" height="20" class="gene-alt"/>
  <text x="160" y="115" text-anchor="middle" class="label" fill="white">D</text>
  <rect x="180" y="100" width="20" height="20" class="gene-alt"/>
  <text x="190" y="115" text-anchor="middle" class="label" fill="white">C</text>
  <rect x="210" y="100" width="20" height="20" class="gene-alt"/>
  <text x="220" y="115" text-anchor="middle" class="label" fill="white">B</text>
  <rect x="240" y="100" width="20" height="20" class="gene"/>
  <text x="250" y="115" text-anchor="middle" class="label" fill="white">E</text>
  
  <!-- Translocation -->
  <text x="50" y="160" class="subtitle">2. 易位 (Translocation)</text>
  
  <!-- Chromosome 1 -->
  <text x="50" y="185" class="label">染色体1:</text>
  <line x1="120" y1="180" x2="280" y2="180" class="chromosome"/>
  <rect x="140" y="170" width="20" height="20" class="gene"/>
  <text x="150" y="185" text-anchor="middle" class="label" fill="white">A</text>
  <rect x="170" y="170" width="20" height="20" class="gene"/>
  <text x="180" y="185" text-anchor="middle" class="label" fill="white">B</text>
  <rect x="200" y="170" width="20" height="20" class="gene"/>
  <text x="210" y="185" text-anchor="middle" class="label" fill="white">C</text>
  
  <!-- Chromosome 2 -->
  <text x="50" y="215" class="label">染色体2:</text>
  <line x1="120" y1="210" x2="280" y2="210" class="chromosome"/>
  <rect x="140" y="200" width="20" height="20" class="gene-alt"/>
  <text x="150" y="215" text-anchor="middle" class="label" fill="white">X</text>
  <rect x="170" y="200" width="20" height="20" class="gene-alt"/>
  <text x="180" y="215" text-anchor="middle" class="label" fill="white">Y</text>
  <rect x="200" y="200" width="20" height="20" class="gene-alt"/>
  <text x="210" y="215" text-anchor="middle" class="label" fill="white">Z</text>
  
  <!-- After translocation -->
  <text x="320" y="185" class="label">易位后:</text>
  <line x1="380" y1="180" x2="540" y2="180" class="chromosome"/>
  <rect x="400" y="170" width="20" height="20" class="gene"/>
  <text x="410" y="185" text-anchor="middle" class="label" fill="white">A</text>
  <rect x="430" y="170" width="20" height="20" class="gene-alt"/>
  <text x="440" y="185" text-anchor="middle" class="label" fill="white">Y</text>
  <rect x="460" y="170" width="20" height="20" class="gene"/>
  <text x="470" y="185" text-anchor="middle" class="label" fill="white">C</text>
  
  <line x1="380" y1="210" x2="540" y2="210" class="chromosome"/>
  <rect x="400" y="200" width="20" height="20" class="gene-alt"/>
  <text x="410" y="215" text-anchor="middle" class="label" fill="white">X</text>
  <rect x="430" y="200" width="20" height="20" class="gene"/>
  <text x="440" y="215" text-anchor="middle" class="label" fill="white">B</text>
  <rect x="460" y="200" width="20" height="20" class="gene-alt"/>
  <text x="470" y="215" text-anchor="middle" class="label" fill="white">Z</text>
  
  <!-- Duplication -->
  <text x="50" y="270" class="subtitle">3. 重复 (Duplication)</text>
  
  <!-- Original -->
  <text x="50" y="295" class="label">原始:</text>
  <line x1="100" y1="290" x2="350" y2="290" class="chromosome"/>
  <rect x="120" y="280" width="20" height="20" class="gene"/>
  <text x="130" y="295" text-anchor="middle" class="label" fill="white">A</text>
  <rect x="150" y="280" width="20" height="20" class="gene"/>
  <text x="160" y="295" text-anchor="middle" class="label" fill="white">B</text>
  <rect x="180" y="280" width="20" height="20" class="gene"/>
  <text x="190" y="295" text-anchor="middle" class="label" fill="white">C</text>
  <rect x="210" y="280" width="20" height="20" class="gene"/>
  <text x="220" y="295" text-anchor="middle" class="label" fill="white">D</text>
  
  <!-- After duplication -->
  <text x="50" y="325" class="label">重复后:</text>
  <line x1="100" y1="320" x2="400" y2="320" class="chromosome"/>
  <rect x="120" y="310" width="20" height="20" class="gene"/>
  <text x="130" y="325" text-anchor="middle" class="label" fill="white">A</text>
  <rect x="150" y="310" width="20" height="20" class="gene"/>
  <text x="160" y="325" text-anchor="middle" class="label" fill="white">B</text>
  <rect x="180" y="310" width="20" height="20" class="gene-new"/>
  <text x="190" y="325" text-anchor="middle" class="label" fill="white">B</text>
  <rect x="210" y="310" width="20" height="20" class="gene"/>
  <text x="220" y="325" text-anchor="middle" class="label" fill="white">C</text>
  <rect x="240" y="310" width="20" height="20" class="gene"/>
  <text x="250" y="325" text-anchor="middle" class="label" fill="white">D</text>
  
  <!-- Deletion -->
  <text x="50" y="380" class="subtitle">4. 缺失 (Deletion)</text>
  
  <!-- Original -->
  <text x="50" y="405" class="label">原始:</text>
  <line x1="100" y1="400" x2="350" y2="400" class="chromosome"/>
  <rect x="120" y="390" width="20" height="20" class="gene"/>
  <text x="130" y="405" text-anchor="middle" class="label" fill="white">A</text>
  <rect x="150" y="390" width="20" height="20" class="gene"/>
  <text x="160" y="405" text-anchor="middle" class="label" fill="white">B</text>
  <rect x="180" y="390" width="20" height="20" class="gene"/>
  <text x="190" y="405" text-anchor="middle" class="label" fill="white">C</text>
  <rect x="210" y="390" width="20" height="20" class="gene"/>
  <text x="220" y="405" text-anchor="middle" class="label" fill="white">D</text>
  <rect x="240" y="390" width="20" height="20" class="gene"/>
  <text x="250" y="405" text-anchor="middle" class="label" fill="white">E</text>
  
  <!-- After deletion -->
  <text x="50" y="435" class="label">缺失后:</text>
  <line x1="100" y1="430" x2="320" y2="430" class="chromosome"/>
  <rect x="120" y="420" width="20" height="20" class="gene"/>
  <text x="130" y="435" text-anchor="middle" class="label" fill="white">A</text>
  <rect x="150" y="420" width="20" height="20" class="gene"/>
  <text x="160" y="435" text-anchor="middle" class="label" fill="white">B</text>
  <rect x="180" y="420" width="20" height="20" class="gene"/>
  <text x="190" y="435" text-anchor="middle" class="label" fill="white">D</text>
  <rect x="210" y="420" width="20" height="20" class="gene"/>
  <text x="220" y="435" text-anchor="middle" class="label" fill="white">E</text>
  
  <!-- Legend -->
  <rect x="450" y="260" width="300" height="120" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" rx="4"/>
  <text x="460" y="280" class="subtitle">图例说明</text>
  <rect x="470" y="290" width="15" height="15" class="gene"/>
  <text x="495" y="302" class="label">原始基因</text>
  <rect x="470" y="310" width="15" height="15" class="gene-alt"/>
  <text x="495" y="322" class="label">重排基因</text>
  <rect x="470" y="330" width="15" height="15" class="gene-new"/>
  <text x="495" y="342" class="label">重复基因</text>
  <line x1="470" y1="355" x2="520" y2="355" class="chromosome"/>
  <text x="530" y="360" class="label">染色体骨架</text>
</svg>