<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #2c3e50; }
      .label { font-family: Arial, sans-serif; font-size: 12px; fill: #34495e; }
      .box { fill: #ecf0f1; stroke: #34495e; stroke-width: 2; rx: 8; }
      .arrow { stroke: #e74c3c; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .process { fill: #3498db; stroke: #2980b9; stroke-width: 2; rx: 6; }
      .result { fill: #2ecc71; stroke: #27ae60; stroke-width: 2; rx: 6; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" class="title">比较基因组学分析流程</text>
  
  <!-- Input genomes -->
  <rect x="50" y="60" width="120" height="60" class="box"/>
  <text x="110" y="85" text-anchor="middle" class="label">基因组序列A</text>
  <text x="110" y="105" text-anchor="middle" class="label">(FASTA/GBK)</text>
  
  <rect x="50" y="140" width="120" height="60" class="box"/>
  <text x="110" y="165" text-anchor="middle" class="label">基因组序列B</text>
  <text x="110" y="185" text-anchor="middle" class="label">(FASTA/GBK)</text>
  
  <rect x="50" y="220" width="120" height="60" class="box"/>
  <text x="110" y="245" text-anchor="middle" class="label">基因组序列C</text>
  <text x="110" y="265" text-anchor="middle" class="label">(FASTA/GBK)</text>
  
  <!-- Annotation step -->
  <rect x="220" y="140" width="120" height="60" class="process"/>
  <text x="280" y="165" text-anchor="middle" class="label" fill="white">基因组注释</text>
  <text x="280" y="185" text-anchor="middle" class="label" fill="white">(Prokka/RAST)</text>
  
  <!-- Homolog identification -->
  <rect x="390" y="140" width="120" height="60" class="process"/>
  <text x="450" y="165" text-anchor="middle" class="label" fill="white">同源基因识别</text>
  <text x="450" y="185" text-anchor="middle" class="label" fill="white">(BLAST/OrthoMCL)</text>
  
  <!-- Comparative analysis -->
  <rect x="560" y="80" width="120" height="50" class="result"/>
  <text x="620" y="100" text-anchor="middle" class="label" fill="white">基因内容比较</text>
  <text x="620" y="115" text-anchor="middle" class="label" fill="white">存在/缺失</text>
  
  <rect x="560" y="140" width="120" height="50" class="result"/>
  <text x="620" y="160" text-anchor="middle" class="label" fill="white">基因顺序比较</text>
  <text x="620" y="175" text-anchor="middle" class="label" fill="white">共线性分析</text>
  
  <rect x="560" y="200" width="120" height="50" class="result"/>
  <text x="620" y="220" text-anchor="middle" class="label" fill="white">序列相似性</text>
  <text x="620" y="235" text-anchor="middle" class="label" fill="white">进化距离</text>
  
  <!-- Arrows -->
  <line x1="170" y1="90" x2="210" y2="160" class="arrow"/>
  <line x1="170" y1="170" x2="210" y2="170" class="arrow"/>
  <line x1="170" y1="250" x2="210" y2="180" class="arrow"/>
  
  <line x1="340" y1="170" x2="380" y2="170" class="arrow"/>
  
  <line x1="510" y1="150" x2="550" y2="105" class="arrow"/>
  <line x1="510" y1="165" x2="550" y2="165" class="arrow"/>
  <line x1="510" y1="180" x2="550" y2="225" class="arrow"/>
  
  <!-- Legend -->
  <rect x="50" y="320" width="700" height="60" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" rx="4"/>
  <text x="60" y="340" class="label" font-weight="bold">分析内容：</text>
  <text x="60" y="355" class="label">• 基因内容：识别共有基因、特异基因和基因家族扩张/收缩</text>
  <text x="60" y="370" class="label">• 基因顺序：检测基因组重排、倒位和易位事件</text>
</svg>