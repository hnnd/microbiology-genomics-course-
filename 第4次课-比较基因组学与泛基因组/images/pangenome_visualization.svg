<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #34495e; }
      .label { font-family: Arial, sans-serif; font-size: 10px; fill: #2c3e50; }
      .core { fill: #2ecc71; }
      .accessory { fill: #f39c12; }
      .unique { fill: #e74c3c; }
      .absent { fill: #ecf0f1; }
      .axis { stroke: #34495e; stroke-width: 1; }
      .grid { stroke: #bdc3c7; stroke-width: 0.5; stroke-dasharray: 2,2; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" class="title">泛基因组可视化方法</text>
  
  <!-- 1. Gene presence/absence heatmap -->
  <text x="50" y="60" class="subtitle">1. 基因存在/缺失热图</text>
  
  <!-- Strain labels -->
  <text x="30" y="85" class="label">菌株1</text>
  <text x="30" y="100" class="label">菌株2</text>
  <text x="30" y="115" class="label">菌株3</text>
  <text x="30" y="130" class="label">菌株4</text>
  <text x="30" y="145" class="label">菌株5</text>
  
  <!-- Gene family labels -->
  <text x="75" y="70" class="label">基因家族</text>
  <text x="85" y="75" class="label">1</text>
  <text x="100" y="75" class="label">2</text>
  <text x="115" y="75" class="label">3</text>
  <text x="130" y="75" class="label">4</text>
  <text x="145" y="75" class="label">5</text>
  <text x="160" y="75" class="label">6</text>
  <text x="175" y="75" class="label">7</text>
  <text x="190" y="75" class="label">8</text>
  
  <!-- Heatmap cells -->
  <!-- Strain 1 -->
  <rect x="80" y="80" width="12" height="12" class="core"/>
  <rect x="95" y="80" width="12" height="12" class="core"/>
  <rect x="110" y="80" width="12" height="12" class="core"/>
  <rect x="125" y="80" width="12" height="12" class="accessory"/>
  <rect x="140" y="80" width="12" height="12" class="unique"/>
  <rect x="155" y="80" width="12" height="12" class="absent"/>
  <rect x="170" y="80" width="12" height="12" class="absent"/>
  <rect x="185" y="80" width="12" height="12" class="absent"/>
  
  <!-- Strain 2 -->
  <rect x="80" y="95" width="12" height="12" class="core"/>
  <rect x="95" y="95" width="12" height="12" class="core"/>
  <rect x="110" y="95" width="12" height="12" class="core"/>
  <rect x="125" y="95" width="12" height="12" class="accessory"/>
  <rect x="140" y="95" width="12" height="12" class="absent"/>
  <rect x="155" y="95" width="12" height="12" class="accessory"/>
  <rect x="170" y="95" width="12" height="12" class="absent"/>
  <rect x="185" y="95" width="12" height="12" class="absent"/>
  
  <!-- Strain 3 -->
  <rect x="80" y="110" width="12" height="12" class="core"/>
  <rect x="95" y="110" width="12" height="12" class="core"/>
  <rect x="110" y="110" width="12" height="12" class="core"/>
  <rect x="125" y="110" width="12" height="12" class="absent"/>
  <rect x="140" y="110" width="12" height="12" class="absent"/>
  <rect x="155" y="110" width="12" height="12" class="accessory"/>
  <rect x="170" y="110" width="12" height="12" class="unique"/>
  <rect x="185" y="110" width="12" height="12" class="absent"/>
  
  <!-- Strain 4 -->
  <rect x="80" y="125" width="12" height="12" class="core"/>
  <rect x="95" y="125" width="12" height="12" class="core"/>
  <rect x="110" y="125" width="12" height="12" class="core"/>
  <rect x="125" y="125" width="12" height="12" class="absent"/>
  <rect x="140" y="125" width="12" height="12" class="absent"/>
  <rect x="155" y="125" width="12" height="12" class="absent"/>
  <rect x="170" y="125" width="12" height="12" class="absent"/>
  <rect x="185" y="125" width="12" height="12" class="unique"/>
  
  <!-- Strain 5 -->
  <rect x="80" y="140" width="12" height="12" class="core"/>
  <rect x="95" y="140" width="12" height="12" class="core"/>
  <rect x="110" y="140" width="12" height="12" class="core"/>
  <rect x="125" y="140" width="12" height="12" class="accessory"/>
  <rect x="140" y="140" width="12" height="12" class="absent"/>
  <rect x="155" y="140" width="12" height="12" class="accessory"/>
  <rect x="170" y="140" width="12" height="12" class="absent"/>
  <rect x="185" y="140" width="12" height="12" class="absent"/>
  
  <!-- 2. Pangenome growth curve -->
  <text x="300" y="60" class="subtitle">2. 泛基因组增长曲线</text>
  
  <!-- Axes -->
  <line x1="320" y1="150" x2="320" y2="80" class="axis"/>
  <line x1="320" y1="150" x2="450" y2="150" class="axis"/>
  
  <!-- Axis labels -->
  <text x="385" y="170" text-anchor="middle" class="label">基因组数量</text>
  <text x="300" y="115" text-anchor="middle" class="label" transform="rotate(-90 300 115)">基因数量</text>
  
  <!-- Grid lines -->
  <line x1="340" y1="150" x2="340" y2="80" class="grid"/>
  <line x1="360" y1="150" x2="360" y2="80" class="grid"/>
  <line x1="380" y1="150" x2="380" y2="80" class="grid"/>
  <line x1="400" y1="150" x2="400" y2="80" class="grid"/>
  <line x1="420" y1="150" x2="420" y2="80" class="grid"/>
  <line x1="440" y1="150" x2="440" y2="80" class="grid"/>
  
  <!-- Pangenome curve -->
  <polyline points="320,140 340,120 360,105 380,95 400,88 420,85 440,83" 
            fill="none" stroke="#e74c3c" stroke-width="3"/>
  
  <!-- Core genome curve -->
  <polyline points="320,130 340,125 360,122 380,120 400,119 420,118 440,118" 
            fill="none" stroke="#2ecc71" stroke-width="3"/>
  
  <!-- Labels -->
  <text x="450" y="88" class="label" fill="#e74c3c">泛基因组</text>
  <text x="450" y="123" class="label" fill="#2ecc71">核心基因组</text>
  
  <!-- 3. Phylogenetic tree with gene distribution -->
  <text x="500" y="60" class="subtitle">3. 系统发育树与基因分布</text>
  
  <!-- Tree branches -->
  <line x1="520" y1="80" x2="520" y2="140" stroke="#34495e" stroke-width="2"/>
  <line x1="520" y1="90" x2="540" y2="90" stroke="#34495e" stroke-width="2"/>
  <line x1="520" y1="110" x2="540" y2="110" stroke="#34495e" stroke-width="2"/>
  <line x1="520" y1="130" x2="540" y2="130" stroke="#34495e" stroke-width="2"/>
  
  <line x1="520" y1="100" x2="560" y2="100" stroke="#34495e" stroke-width="2"/>
  <line x1="560" y1="90" x2="560" y2="110" stroke="#34495e" stroke-width="2"/>
  
  <!-- Strain labels -->
  <text x="545" y="95" class="label">菌株A</text>
  <text x="545" y="115" class="label">菌株B</text>
  <text x="525" y="135" class="label">菌株C</text>
  
  <!-- Gene presence bars -->
  <rect x="580" y="87" width="8" height="6" class="core"/>
  <rect x="590" y="87" width="8" height="6" class="core"/>
  <rect x="600" y="87" width="8" height="6" class="accessory"/>
  <rect x="610" y="87" width="8" height="6" class="unique"/>
  
  <rect x="580" y="107" width="8" height="6" class="core"/>
  <rect x="590" y="107" width="8" height="6" class="core"/>
  <rect x="600" y="107" width="8" height="6" class="accessory"/>
  <rect x="610" y="107" width="8" height="6" class="absent"/>
  
  <rect x="580" y="127" width="8" height="6" class="core"/>
  <rect x="590" y="127" width="8" height="6" class="core"/>
  <rect x="600" y="127" width="8" height="6" class="absent"/>
  <rect x="610" y="127" width="8" height="6" class="absent"/>
  
  <!-- 4. Functional classification pie chart -->
  <text x="50" y="220" class="subtitle">4. 功能分类饼图</text>
  
  <!-- Pie chart -->
  <circle cx="150" cy="280" r="50" fill="#ecf0f1" stroke="#bdc3c7"/>
  
  <!-- Pie slices -->
  <path d="M 150 230 A 50 50 0 0 1 185 255 L 150 280 Z" class="core"/>
  <path d="M 185 255 A 50 50 0 0 1 185 305 L 150 280 Z" class="accessory"/>
  <path d="M 185 305 A 50 50 0 0 1 115 305 L 150 280 Z" class="unique"/>
  <path d="M 115 305 A 50 50 0 1 1 150 230 L 150 280 Z" fill="#95a5a6"/>
  
  <!-- Labels -->
  <text x="170" y="250" class="label">核心基因</text>
  <text x="190" y="280" class="label">辅助基因</text>
  <text x="170" y="310" class="label">独特基因</text>
  <text x="120" y="280" class="label">其他</text>
  
  <!-- 5. Gene accumulation curve -->
  <text x="300" y="220" class="subtitle">5. 基因积累曲线</text>
  
  <!-- Axes -->
  <line x1="320" y1="330" x2="320" y2="250" class="axis"/>
  <line x1="320" y1="330" x2="450" y2="330" class="axis"/>
  
  <!-- Curve -->
  <polyline points="320,320 340,300 360,285 380,275 400,268 420,263 440,260" 
            fill="none" stroke="#9b59b6" stroke-width="3"/>
  
  <!-- Labels -->
  <text x="385" y="350" text-anchor="middle" class="label">采样顺序</text>
  <text x="300" y="290" text-anchor="middle" class="label" transform="rotate(-90 300 290)">累积基因数</text>
  
  <!-- 6. Venn diagram -->
  <text x="500" y="220" class="subtitle">6. 韦恩图 (3个菌株)</text>
  
  <!-- Three overlapping circles -->
  <circle cx="550" cy="270" r="35" fill="#3498db" fill-opacity="0.5" stroke="#2980b9"/>
  <circle cx="580" cy="270" r="35" fill="#e74c3c" fill-opacity="0.5" stroke="#c0392b"/>
  <circle cx="565" cy="300" r="35" fill="#2ecc71" fill-opacity="0.5" stroke="#27ae60"/>
  
  <!-- Labels -->
  <text x="535" y="250" class="label" fill="white">菌株1</text>
  <text x="595" y="250" class="label" fill="white">菌株2</text>
  <text x="565" y="325" class="label" fill="white">菌株3</text>
  
  <!-- Numbers -->
  <text x="530" y="275" class="label" font-weight="bold">120</text>
  <text x="600" y="275" class="label" font-weight="bold">95</text>
  <text x="565" y="315" class="label" font-weight="bold">110</text>
  <text x="565" y="275" class="label" font-weight="bold">850</text>
  
  <!-- Legend -->
  <rect x="50" y="380" width="700" height="80" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" rx="4"/>
  <text x="60" y="400" class="subtitle">图例说明：</text>
  
  <rect x="70" y="410" width="12" height="12" class="core"/>
  <text x="90" y="420" class="label">核心基因 (所有菌株共有)</text>
  
  <rect x="220" y="410" width="12" height="12" class="accessory"/>
  <text x="240" y="420" class="label">辅助基因 (部分菌株拥有)</text>
  
  <rect x="370" y="410" width="12" height="12" class="unique"/>
  <text x="390" y="420" class="label">独特基因 (单个菌株特有)</text>
  
  <rect x="520" y="410" width="12" height="12" class="absent"/>
  <text x="540" y="420" class="label">基因缺失</text>
  
  <text x="60" y="440" class="label">• 热图显示基因在不同菌株中的存在/缺失模式</text>
  <text x="60" y="450" class="label">• 增长曲线反映泛基因组的开放性或封闭性特征</text>
</svg>